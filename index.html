<head>

  <link rel="stylesheet" preload="true" href="/css/page.css">

  <link rel="stylesheet" href="/css/all.min.css">
  <link rel="stylesheet" href="/css/glitch.css">
  
  <script src="/js/Gradient.js"></script>
 
  <style>
    .circle-paused svg circle {
      animation-play-state: paused
    }
    button {
      color: currentColor;
    }
    button.ripple>*,
    a.ripple>* {
      pointer-events: none;
    }
    
    html.preloaded .marquee-y>* {
      animation: none;
    }
    
    .marquee-y>* {
      animation: marquee-y 4s calc(var(--t) - 4s) linear infinite;
    }
    
    @keyframes marquee-y {
      to {
        transform: translateY(var(--px));
      }
    }
    
    .\[\&\>\*\]\:absolute>* {
      position: absolute;
    }
    
    /* .relative {
  position: relative;
} */
    @keyframes fadeIn {

      0%,
      50% {
        opacity: 0;
      }
      
      100% {
        opacity: 1;
      }
    }
    
    body {
      animation: 1.5s ease-out fadeIn forwards;
      background: #282828;
    }
    
    .bg-near-black {
      background: #282828;
    }
    
    .rotext {
      perspective: calc(3*48px);
      perspective-origin: top right;
    }
    
    .rotext>* {
      --y: 60px;
      transform: rotateX(90deg) translate3d(0, var(--y), 0);
      opacity: 0;
      /*   transition: transform 0s linear .45s, opacity 0.3s linear; */
      transition: transform .65s cubic-bezier(.215, .61, .355, 1) calc(var(--index, 0) * .1s + .55s), opacity .35s linear calc(var(--index, 0) * .1s + .55s);
      transform-origin: center bottom;
      transform-style: preserve-3d;
    }
    
    .rotext.show>* {
      transform: rotateX(0deg);
      opacity: 1;
    }
    
    .done {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.5s, transform 0.3s 0.12s ease, visibility 0s 0.06s;
    }
  </style>
  <style class="b70beddb-8a03-40a9-a514-589dc67489e6">
    .vh-full {
      height: 100vh;
    }
    
    .path {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: dash 5s linear alternate infinite;
    }
    
    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>
  <style class="be88bf2f-65dc-4be1-a04c-5bb025e8266b">
    .z-force-unset {
      z-index: unset !important;
    }
    
    .\[\&\>\*\]\:inline-block>* {
      display: inline-block;
    }
    
    html,
    .smooth-scroll {
      scroll-behavior: smooth
    }
    
    .\[\&\>\*\]\:animate-y-full>* {
      animation: translate-y-full 0.5s var(--delay) cubic-bezier(0.37, 0, 0.63, 1) forwards;
      display: inline-block;
    }
    
    .scaffold>div {
      transition: .6s var(--delay) cubic-bezier(0.645, 0.045, 0.355, 1);
    }
    
    html.preloaded .scaffold {
      pointer-events: none;
    }
    
    html.preloaded .scaffold>div {
      --tw-translate-y: -100%;
    }
    
    html.preloaded main canvas + section {
      height: auto;
    }
    /*END: of styles for intro text */
    .skeleton {
      color: transparent;
      animation: skeleton-loading 0.8s ease-in-out infinite alternate;
    }
    
    @keyframes skeleton-loading {
      0% {
        background-color: hsl(200, 20%, 80%);
      }
      
      100% {
        background-color: hsl(200, 20%, 95%);
      }
    }
    
    .ripple {
      overflow: hidden;
    }
    
    .dots-6 {
      width: 30px;
      aspect-ratio: 1.154;
      --_g: no-repeat radial-gradient(farthest-side, currentColor 90%, #0000);
      background: var(--_g) 50% 0, var(--_g) 0 100%, var(--_g) 100% 100%;
      background-size: 35% calc(35%*1.154);
      animation: d6 0.58s infinite;
    }
    
    @keyframes d6 {

      50%,
      100% {
        background-position: 100% 100%, 50% 0, 0 100%;
      }
    }
  </style>
  <style class="ce77170-0f0a-456b-8792-cbe8bb2cfff8">
    @keyframes animate-left-1_10 {
      100% {
        left: 20%;
        opacity: 1;
      }
    }
    
    @keyframes inputHighlighter {
      0% {
        background: #5264AE;
      }
      
      100% {
        width: 0;
        background: transparent;
      }
    }
    
    @keyframes translate-y-full {
      0% {
        transform: translateY(0%);
      }
      
      100% {
        transform: translateY(200%);
      }
    }
    
    @keyframes rotate {
      from {
        transform: translateX(0);
      }
      
      to {
        transform: translateX(-50%);
      }
    }
    
    @keyframes loader {
      0% {
        transform:
          /*translateX(-50%) translateY(-50%) */
          scale(1) rotate(-90deg);
      }
      
      25% {
        transform: scale(1.1) rotate(-90deg);
      }
      
      50% {
        transform: scale(1.1) rotate(-180deg);
      }
      
      75% {
        transform: scale(1.1) rotate(-180deg);
      }
      
      100% {
        transform:
          /*translateX(-50%) translateY(-50%) */
          scale(1) rotate(-180deg);
      }
    }
    .z-2 {
      z-index: 2;
    }
  </style>
</head>

<body onanimationended="if(_debug) return; let cls=['bg-red-400','bg-yellow-500','bg-near-black']; qS('.scaffold>div',!0).forEach((div,i)=>delay(_=>div.classList.add(cls[i]), 750 * i)), delay(_=>event.target==this&&preload(),1e3)">
    
  <canvas id="gradient" class="opacity-0 w-full h-full fixed bg-white duration-300 ease-out" ontransitionended="event.propertyName=='opacity'&&enter()"></canvas>

  <main class="text-white bg-n-black">
    <section>
      <main class="relative flex items-center vh-full">
       <section class="sm:border-r border-dashed border-current flex-1 h-full sm:overflow-visible overflow-x-hidden space-y-2 z-1 relative flex sm:items-start justify-center flex-col">
        <h1 style='line-height:0.8' class='break-all relative sm:tracking-tighter font-semibold text-center precise-typo-1 italic'>
          NULL<span class=sm:block></span>VEKTOR
          <div style="animation:anim-round .8s ease-out infinite; --_reach: calc(-1*var(--reach)); --reach: 1px;" class="inset-0.5 absolute mix-blend-difference text-gray-900 sm:text-white" style="--tw-bg-opacity: 0.3">NULL<span class=sm:block></span>VEKTOR</div>
        </h1>
        <ul class="mt-5 sm:text-2xl mx-6 [&>*]:relative sm:static relative font-mono">
          <aside style='position: absolute' class='absolute decorate out inset-0'>
            <div style="--tw-bg-opacity: 0.3; --tw-scale-x:1.3; --tw-scale-y:var(--tw-scale-x);" class="shadow bottom-1/4 duration-300 ease-out -left-1/4 absolute sm:p-60 p-28 rounded-full bg-yellow-100"></div>
            <div style="--tw-bg-opacity: 0.3; --tw-scale-x:1.3; --tw-scale-y:var(--tw-scale-x);" class="shadow bottom-1/4 duration-300 ease-out -right-1/4 sm:-right-1/2 absolute p-28 sm:p-60 rounded-full bg-black"></div>
            <div style="--tw-bg-opacity: 0.3; --tw-scale-x:1.3; --tw-scale-y:var(--tw-scale-x); left:18%" class="shadow top-1/2 duration-300 ease-out absolute p-28 sm:top-1/4 sm:p-60 rounded-full bg-gray-300"></div>
          </aside>
          <li>Remote Access Management</li>
          <li>Media Access</li>
          <li>User Data Tracking</li>
          <li>Location Tracking</li>
          <li>Social Media Access</li>
          <li>Hands-free Target Phone Access</li>
          <li>Unlimited Access</li>
        </ul>
       </section>
       <figure style='z-index:auto;' class="flex flex-1 h-full left-0 tooltip no-hover no-focus -slide-y sm:show absolute sm:relative">
         <aside style="background-image: url('./img/hero-bg.jpeg')" class='blur filter absolute bg-center inset-0'></aside>
         <img src="img/hero-bg.jpeg" class="relative border-2 border-gray-300 shadow rounded-3xl my-auto h-auto w-full">
       </figure>
       <!-- hero background hidden on large viewports -->
       <aside style="background-image: url('./img/hero-bg.jpeg')" class='absolute bg-contain bg-no-repeat bg-center inset-0 sm:hidden'></aside>
       <!-- noise background -->
      <aside class="border pointer-events-none absolute inset-0 backdrop-blur-sm backdrop-filter" style="background-image: url('./noise.svg')"></aside>
      </main>
    </section>
  </main>
    <nav id="growShrink" class="text-center text-white fixed tooltip -slide-y show no-hover no-focus text-sm bottom-2 left-0 right-0">
      <div style="--px:0.5em; --py:0.5em; --tw-bg-opacity:calc(var(--bg-opacity-pad) + 0.5)" class="rounded-full bg-black [&>*]:align-middle rounded-inherit [&>*]:rounded-inherit inline-block [&>*]:p-xy backdrop-filter backdrop-blur p-1 lg:p-3 sm:p-2 cursor-pointer">
        <a class="ripple hover:bg-white relative" onclick="document.documentElement.classList.remove('preloaded')">
          <div class="out decorate inset-0 absolute tooltip" style="z-index: auto">
            <div style="--tw-bg-opacity: 0.5; --tw-scale-x:1.1; --tw-scale-y:var(--tw-scale-x);" class="bg-white inset-0 absolute p-0 rounded-full duration-300 ease-out"></div>
          </div><span class="mx-2 relative"><i class="fa fa-arrow-left"></i> Nullvektor</span>
        </a>
        <a class="hover:bg-white relative">
          <div class="out decorate inset-0 absolute tooltip" style="z-index: auto">
            <div class="bg-white inset-0 absolute p-0 rounded-full duration-300 ease-out" style="--tw-bg-opacity: 0.5; --tw-scale-x:1.2; --tw-scale-y:var(--tw-scale-x);"></div>
          </div><span class="relative"><i class="fa fa-address-card"></i>&nbsp;contact&nbsp;us</span>
        </a>
        <span class="sm:relative absolute"></span>
        <a class="hover:bg-white relative fluid base:show">
          <div class="out decorate inset-0 absolute tooltip" style="z-index: auto">
            <div class="bg-white inset-0 absolute p-0 rounded-full duration-300 ease-out" style="--tw-bg-opacity: 0.5; --tw-scale-x:1.2; --tw-scale-y:var(--tw-scale-x);"></div>
          </div><span class="relative"><i class="fa fa-user"></i>&nbsp;testaments</span>
        </a>
        <!--<span class="md:relative absolute"></span><a class="fluid md:show hover:bg-yellow-600 bg-yellow-500" data-i="3"><div class="out decorate inset-0 absolute tooltip" style="z-index: auto"><div class="bg-yellow-500 inset-0 absolute p-0 rounded-full duration-300 ease-out" style="--tw-bg-opacity: 0.5; --tw-scale-x:1.2; --tw-scale-y:var(--tw-scale-x);"></div></div><span class="relative"><i class="fa fa-font"></i><i class="fa fa-project-diagram"></i> assets</span></a>-->
        <span class="md:relative absolute"></span>
        <a class="fluid sm:show hover:bg-white relative">
          <div class="out decorate inset-0 absolute tooltip" style="z-index: auto">
            <div class="bg-white inset-0 absolute p-0 rounded-full duration-300 ease-out" style="--tw-bg-opacity: 0.5; --tw-scale-x:1.2; --tw-scale-y:var(--tw-scale-x);"></div>
          </div><span class="relative"><i class="fa fa-icons"></i>&nbsp;about&nbsp;us</span>
        </a>
        <div class="text-center bg-inherit lg:absolute lg:invisible" style="padding:0">
          <button class="hover:bg-gray-300 ripple relative text-current" style="border-color: currentcolor;">•••</button>
          <div style="white-space:normal; padding:0px; --tw-bg-opacity:calc(var(--bg-opacity-pad) + 0.8); " class="bottom-full text-sm bg-black">
            <div></div>
          </div>
        </div>
      </div>
    </nav>
    
  <script>
    let loadImgs = (srcs, invk, all) => {
        let count = 0;
        srcs.forEach((src, img) => {
          (img = new Image()).src = src, img.onload = _ => all ? ++count === srcs.length && invk?.call(null, srcs) : invk?.call(null, src)
        })
      },
      mockups = ['2:company.png', '3:stack.png', '8:mockup.png', '5:web-sql.png', 'node-server.png'],
      loadMockups = (i, invk, all) => {
        let itm = mockups[i].split(':'),
          srcs = N(+itm[0]).map((n, nm) => '/mockups/' + ((nm = itm[1].split('.'))[0] += '-' + n + '.' + nm[1]));
        srcs[0] ||= '/mockups/' + mockups[i], loadImgs(srcs, invk, all)
      };
  </script>
  <script>
    function onScroll(page, mthd, sTop, t, nav, heap) {
      !(t = onScroll).lastY && (t.lastY = 0), sTop = page.scrollY || page.scrollTop, nav = qS('nav.topCta'),
        mthd = cLs, nav && ['show' /*, 'relative', 'absolute'*/ ]
        .forEach((e, i, a, cls) => {
          (cls = nav.classList)[mthd(heap = sTop < t.lastY)](e),
          i === 2 && cls[mthd(!heap)](e), i === 1 && cls[mthd(heap)](e)
        }),
        setTimeout(_ => t.lastY = sTop);
      return t.lastY / (page.scrollHeight || innerHeight)
    }
    let DOMLoaded, ratio;
    w_Ev_dom(_=>{
      new Gradient({ canvas: 'canvas#gradient', colors: ['#000000', '#aaaaaa', '#282828'] }),
      Ev('scroll'), DOMLoaded = !0, animations.addRippleAnimations()
    })

  </script>
</body>
</html>
